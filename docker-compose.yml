services:
  erechnung:
    build: .
    container_name: erechnung
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      # Eigene Firmendaten hier eintragen - werden auf jeder Rechnung verwendet.
      SELLER_NAME: "Meine Firma GmbH"
      SELLER_STREET: "Musterstrasse 1"
      SELLER_POSTCODE: "10115"
      SELLER_CITY: "Berlin"
      SELLER_COUNTRY: "DE"
      SELLER_TAX_ID: "DE123456789"       # USt-IdNr.
      SELLER_TAX_NUMBER: "12/345/67890"  # Steuernummer
      SELLER_EMAIL: "rechnung@meinefirma.de"
      SELLER_IBAN: "DE00 0000 0000 0000 0000 00"
      SELLER_BIC: "XXXXDEXXX"
      SELLER_BANK: "Musterbank"
      # Auf false setzen, wenn die App nur im LAN laeuft und du keinen Passwortschutz willst.
      REQUIRE_AUTH: "false"
      BASIC_AUTH_USER: "admin"
      BASIC_AUTH_PASS: "bitte-aendern"
