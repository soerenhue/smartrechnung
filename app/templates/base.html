<!doctype html>
<!--
  SmartRechnung - Freies E-Rechnungs-Werkzeug
  Made with coffee by Sören Hülsemeyer in Deutschland.
  Wenn du das hier liest, hast du in den Quelltext geschaut. Respekt.
  Open Source: https://github.com/soerenhue/smartrechnung
-->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}E-Rechnung{% endblock %}</title>
<style>
  /* App-UI-Farben sind FEST (zum Icon passend) - unabhaengig von
     den Branding-Farben der Rechnung. */
  :root {
    --primary: #4F46E5;   /* Indigo, passt zum SmartRechnung-Icon */
    --accent:  #3B82F6;   /* App-Button-Blau */
    --text:    #111827;
    --muted:   #6b7280;
    --border:  #e5e7eb;
    --bg:      #f9fafb;
    --card:    #ffffff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
         color: var(--text); background: var(--bg); }
  header { background: var(--primary); color: #fff; padding: 12px 24px;
           display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
  header a { color: #fff; text-decoration: none; margin-left: 16px; font-weight: 500; }
  header a:hover { text-decoration: underline; }
  header .brand { font-size: 1.1rem; font-weight: 700; }
  header .right { display: flex; align-items: center; gap: 12px; }
  header form { margin: 0; }
  header select { background: rgba(255,255,255,0.15); color: #fff; border: 1px solid rgba(255,255,255,0.3);
                  padding: 6px 10px; border-radius: 4px; font: inherit; }
  header select option { color: #111; }
  main { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
  .card { background: var(--card); border: 1px solid var(--border);
          border-radius: 8px; padding: 20px; margin-bottom: 16px; }
  h1 { margin-top: 0; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); font-size: 0.95rem; }
  th { background: #f3f4f6; }
  .btn { display: inline-block; background: var(--accent); color: #fff; padding: 8px 14px;
         border-radius: 6px; text-decoration: none; border: 0; cursor: pointer; font-size: 0.95rem; }
  .btn:hover { opacity: 0.9; }
  .btn-secondary { background: #fff; color: var(--text); border: 1px solid var(--border); }
  .btn-danger { background: #dc2626; color: #fff; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid-3 { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1fr auto; gap: 8px; align-items: center; }
  input, select, textarea { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; font: inherit; }
  label { font-size: 0.85rem; color: var(--muted); display: block; margin-bottom: 4px; }
  .muted { color: var(--muted); font-size: 0.9rem; }
  .ok { color: #047857; } .warn { color: #b45309; } .err { color: #b91c1c; }
  .right { text-align: right; }
  .sum-row td { font-weight: 600; }
  .total-row td { font-weight: 700; font-size: 1.1rem; border-top: 2px solid var(--primary); }
  .pill { background: #eef2ff; color: var(--primary); padding: 2px 8px; border-radius: 999px; font-size: 0.8rem; }
  @media (max-width: 760px) { .grid, .grid-3 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <div class="brand">
    <a href="/ueber" style="color:#fff;text-decoration:none"
       title="Über SmartRechnung">SmartRechnung</a>
    {% if active %}<span class="pill" style="background:rgba(255,255,255,0.2);color:#fff">{{ active.display_name }}</span>{% endif %}
  </div>
  <div class="right">
    {% if companies and companies|length > 1 %}
      <form method="post" action="/firma/wechseln">
        <select name="slug" onchange="this.form.submit()">
          {% for c in companies %}
            <option value="{{ c.slug }}" {% if active and c.slug == active.slug %}selected{% endif %}>{{ c.display_name }}</option>
          {% endfor %}
        </select>
      </form>
    {% endif %}
    <nav>
      <a href="/">Ausgang</a>
      <a href="/neu">Neue Rechnung</a>
      <a href="/eingang">Eingang</a>
      <a href="/kunden">Kunden</a>
      <a href="/firmen">Firmen</a>
      <a href="/export/gobd">GoBD-Export</a>
    </nav>
  </div>
</header>
<main>{% block content %}{% endblock %}</main>
<footer style="text-align:center;padding:20px;color:var(--muted);font-size:0.75rem">
  <a href="/ueber" style="color:var(--muted);text-decoration:none">SmartRechnung</a>
</footer>
</body>
</html>
