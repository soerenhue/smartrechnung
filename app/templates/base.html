<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}E-Rechnung{% endblock %}</title>
<style>
  :root {
    --primary: {{ branding.primary_color|default('#1e3a8a') }};
    --accent: {{ branding.accent_color|default('#3b82f6') }};
    --text: #111827;
    --muted: #6b7280;
    --border: #e5e7eb;
    --bg: #f9fafb;
    --card: #ffffff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
         color: var(--text); background: var(--bg); }
  header { background: var(--primary); color: #fff; padding: 12px 24px;
           display: flex; justify-content: space-between; align-items: center; }
  header a { color: #fff; text-decoration: none; margin-left: 16px; font-weight: 500; }
  header a:hover { text-decoration: underline; }
  header .brand { font-size: 1.1rem; font-weight: 700; }
  main { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
  .card { background: var(--card); border: 1px solid var(--border);
          border-radius: 8px; padding: 20px; margin-bottom: 16px; }
  h1 { margin-top: 0; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); font-size: 0.95rem; }
  th { background: #f3f4f6; }
  .btn { display: inline-block; background: var(--accent); color: #fff; padding: 8px 14px;
         border-radius: 6px; text-decoration: none; border: 0; cursor: pointer; font-size: 0.95rem; }
  .btn:hover { opacity: 0.9; }
  .btn-secondary { background: #fff; color: var(--text); border: 1px solid var(--border); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid-3 { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1fr auto; gap: 8px; align-items: center; }
  input, select, textarea { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; font: inherit; }
  label { font-size: 0.85rem; color: var(--muted); display: block; margin-bottom: 4px; }
  .muted { color: var(--muted); font-size: 0.9rem; }
  .ok { color: #047857; } .warn { color: #b45309; } .err { color: #b91c1c; }
  .right { text-align: right; }
  .sum-row td { font-weight: 600; }
  .total-row td { font-weight: 700; font-size: 1.1rem; border-top: 2px solid var(--primary); }
  @media (max-width: 760px) { .grid, .grid-3 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <div class="brand">E-Rechnung</div>
  <nav>
    <a href="/">Rechnungen</a>
    <a href="/neu">Neue Rechnung</a>
    <a href="/einstellungen">Einstellungen</a>
    <a href="/export/gobd">GoBD-Export</a>
  </nav>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
