<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#3B82F6"/>
      <stop offset="55%"  stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F3F4F6"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="0" dy="14" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Hintergrund: abgerundetes Quadrat mit Gradient -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224" fill="url(#bg)"/>

  <!-- Dezenter Lichtreflex oben links -->
  <path d="M 0 0 L 1024 0 L 1024 180 Q 512 320 0 180 Z"
        fill="#FFFFFF" opacity="0.08"/>

  <!-- Rechnungs-Blatt in der Mitte -->
  <g filter="url(#shadow)">
    <path d="M 304 212
             L 672 212
             Q 696 212 696 236
             L 696 796
             L 648 772
             L 600 796
             L 552 772
             L 504 796
             L 456 772
             L 408 796
             L 360 772
             L 312 796
             L 304 796
             Z"
          fill="url(#paper)"/>
  </g>

  <!-- Zeilen auf der Rechnung -->
  <g fill="#CBD5E1">
    <rect x="356" y="304" width="200" height="22" rx="11"/>
    <rect x="356" y="348" width="140" height="18" rx="9"/>
  </g>
  <g fill="#E5E7EB">
    <rect x="356" y="420" width="288" height="12" rx="6"/>
    <rect x="356" y="454" width="288" height="12" rx="6"/>
    <rect x="356" y="488" width="220" height="12" rx="6"/>
    <rect x="356" y="534" width="288" height="12" rx="6"/>
    <rect x="356" y="568" width="180" height="12" rx="6"/>
  </g>
  <!-- Summen-Linie -->
  <rect x="356" y="636" width="288" height="4" rx="2" fill="#94A3B8"/>
  <rect x="470" y="662" width="174" height="22" rx="11" fill="#1E293B"/>

  <!-- Smart-Blitz als Akzent (über der Rechnung) -->
  <g transform="translate(560 170) rotate(10)">
    <path d="M 60 0
             L 20 110
             L 70 110
             L 30 220
             L 140 90
             L 90 90
             L 120 0
             Z"
          fill="url(#bolt)"
          stroke="#FFFFFF" stroke-width="10" stroke-linejoin="round"/>
  </g>
</svg>
