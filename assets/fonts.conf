<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- macOS: alle System- und Userschriften -->
  <dir>/System/Library/Fonts</dir>
  <dir>/Library/Fonts</dir>
  <dir prefix="default">~/Library/Fonts</dir>

  <!-- Linux-Fallback, falls jemand die App auf Linux nutzt -->
  <dir>/usr/share/fonts</dir>
  <dir>/usr/local/share/fonts</dir>
  <dir>~/.fonts</dir>

  <!-- Cache-Verzeichnisse an einen User-schreibbaren Platz -->
  <cachedir>~/.cache/fontconfig</cachedir>
  <cachedir>/var/cache/fontconfig</cachedir>

  <!-- Standard-Fallback-Schriften (damit WeasyPrint nicht leer bleibt) -->
  <alias>
    <family>serif</family>
    <prefer>
      <family>Helvetica</family>
      <family>Arial</family>
      <family>Times</family>
      <family>DejaVu Serif</family>
    </prefer>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Helvetica Neue</family>
      <family>Helvetica</family>
      <family>Arial</family>
      <family>DejaVu Sans</family>
    </prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Menlo</family>
      <family>Monaco</family>
      <family>Courier</family>
      <family>DejaVu Sans Mono</family>
    </prefer>
  </alias>

  <!-- Lies ggf. weitere XML-Dateien aus einem Unterverzeichnis ein (optional) -->
  <include ignore_missing="yes">conf.d</include>
</fontconfig>
