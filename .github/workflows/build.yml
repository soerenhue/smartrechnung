# Automatischer Build-Workflow.
#
# Bei einem Tag (z.B. v1.0.0) werden Installer fuer Windows, macOS und Linux
# gebaut und als Release-Artefakte an die GitHub-Release-Seite angehaengt.
# Deine Freunde laden einfach die passende Datei runter und doppelklicken.

name: Build Desktop-App

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: E-Rechnung-Windows.zip
            archive: "pwsh -Command Compress-Archive -Path dist/* -DestinationPath E-Rechnung-Windows.zip"
          - os: macos-latest
            artifact: E-Rechnung-macOS.zip
            archive: "cd dist && zip -r ../E-Rechnung-macOS.zip ."
          - os: ubuntu-latest
            artifact: E-Rechnung-Linux.tar.gz
            archive: "tar -czvf E-Rechnung-Linux.tar.gz -C dist ."
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system libs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b \
              libcairo2 libgdk-pixbuf-2.0-0 libffi-dev shared-mime-info

      - name: Install system libs (macOS)
        if: runner.os == 'macOS'
        run: brew install pango cairo gdk-pixbuf libffi

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Build with PyInstaller
        run: pyinstaller erechnung.spec --clean

      - name: Package
        shell: bash
        run: ${{ matrix.archive }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
