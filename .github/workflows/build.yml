name: Build Desktop-App

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: SmartRechnung-Windows.zip
            archive: "pwsh -Command Compress-Archive -Path dist/* -DestinationPath SmartRechnung-Windows.zip"
          - os: macos-latest
            artifact: SmartRechnung-macOS.zip
            archive: "cd dist && zip -ry ../SmartRechnung-macOS.zip ."
          - os: ubuntu-latest
            artifact: SmartRechnung-Linux.tar.gz
            archive: "tar -czf SmartRechnung-Linux.tar.gz -C dist ."
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        shell: bash
        run: |
          # Browser in ein bekanntes Verzeichnis im Projektpfad installieren,
          # damit PyInstaller es finden und mitpacken kann.
          mkdir -p "$GITHUB_WORKSPACE/ms-playwright"
          export PLAYWRIGHT_BROWSERS_PATH="$GITHUB_WORKSPACE/ms-playwright"
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> $GITHUB_ENV
          python -m playwright install chromium
          echo "=== Chromium in Bundle-Pfad: ==="
          ls -la "$PLAYWRIGHT_BROWSERS_PATH" | head -5

      - name: Build with PyInstaller
        shell: bash
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
        run: pyinstaller erechnung.spec --clean --noconfirm

      - name: macOS - Chromium ins Bundle kopieren + signieren
        if: runner.os == 'macOS'
        run: |
          APP="dist/SmartRechnung.app"
          [ -f "dist/SmartRechnung" ] && rm -f "dist/SmartRechnung"

          # Chromium nach Contents/Resources/ms-playwright kopieren
          # (der Launcher sucht genau dort)
          TARGET="$APP/Contents/Resources/ms-playwright"
          mkdir -p "$TARGET"
          cp -R "$PLAYWRIGHT_BROWSERS_PATH"/* "$TARGET/"
          echo "=== Chromium im Bundle: ==="
          ls -la "$TARGET" | head

          # Einmalig das gesamte Bundle inklusive Chromium signieren
          codesign --force --deep --sign - --timestamp=none "$APP" || true
          ls -la dist/

      - name: Package
        shell: bash
        run: ${{ matrix.archive }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
