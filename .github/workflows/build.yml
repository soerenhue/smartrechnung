name: Build Desktop-App

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: SmartRechnung-Windows.zip
            archive: "pwsh -Command Compress-Archive -Path dist/* -DestinationPath SmartRechnung-Windows.zip"
          - os: macos-latest
            artifact: SmartRechnung-macOS.zip
            archive: "cd dist && zip -r ../SmartRechnung-macOS.zip ."
          - os: ubuntu-latest
            artifact: SmartRechnung-Linux.tar.gz
            archive: "tar -czvf SmartRechnung-Linux.tar.gz -C dist ."
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system libs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b \
              libcairo2 libgdk-pixbuf-2.0-0 libffi-dev shared-mime-info

      - name: Install system libs (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install pango cairo gdk-pixbuf libffi dylibbundler
          # Die brew-Libs auf Apple Silicon liegen in /opt/homebrew/lib,
          # auf Intel-Macs in /usr/local/lib. Beides fuer den Build verfuegbar machen.
          echo "DYLD_LIBRARY_PATH=/opt/homebrew/lib:/usr/local/lib" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=/opt/homebrew/lib/pkgconfig:/usr/local/lib/pkgconfig" >> $GITHUB_ENV

      # macOS braucht .icns - wir generieren es aus den PNGs
      - name: Build macOS .icns
        if: runner.os == 'macOS'
        run: |
          mkdir -p assets/icon.iconset
          cp assets/icon_16.png   assets/icon.iconset/icon_16x16.png
          cp assets/icon_32.png   assets/icon.iconset/icon_16x16@2x.png
          cp assets/icon_32.png   assets/icon.iconset/icon_32x32.png
          cp assets/icon_64.png   assets/icon.iconset/icon_32x32@2x.png
          cp assets/icon_128.png  assets/icon.iconset/icon_128x128.png
          cp assets/icon_256.png  assets/icon.iconset/icon_128x128@2x.png
          cp assets/icon_256.png  assets/icon.iconset/icon_256x256.png
          cp assets/icon_512.png  assets/icon.iconset/icon_256x256@2x.png
          cp assets/icon_512.png  assets/icon.iconset/icon_512x512.png
          cp assets/icon_1024.png assets/icon.iconset/icon_512x512@2x.png
          iconutil -c icns assets/icon.iconset -o assets/icon.icns
          ls -la assets/icon.icns

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Build with PyInstaller
        run: pyinstaller erechnung.spec --clean --noconfirm

      # macOS: System-dylibs ins .app-Bundle kopieren.
      # WeasyPrint laedt gobject/pango/cairo erst zur LAUFZEIT ueber dlopen,
      # d.h. die Libs sind nicht gelinkt - dylibbundler erkennt sie nicht
      # selbststaendig. Deshalb kopieren wir sie explizit hinein und lassen
      # dylibbundler dann die Transitive-Deps rebundeln.
      - name: Bundle dylibs (macOS)
        if: runner.os == 'macOS'
        run: |
          set -e
          APP="dist/SmartRechnung.app"
          if [ ! -d "$APP" ]; then
            echo "Kein .app-Bundle in dist/ gefunden"; exit 1
          fi
          FRAMEWORKS="$APP/Contents/Frameworks"
          mkdir -p "$FRAMEWORKS"

          # Alle Libs, die WeasyPrint / fontconfig / cairo zur Laufzeit erwartet
          LIBS="libgobject-2.0 libglib-2.0 libgio-2.0 libgmodule-2.0 libgthread-2.0 \
                libpango-1.0 libpangoft2-1.0 libpangocairo-1.0 \
                libcairo libcairo-gobject \
                libgdk_pixbuf-2.0 \
                libharfbuzz libfontconfig libfreetype libpng16 \
                libffi libintl libpcre2-8 libpixman-1 \
                libxml2 libxcb libxau libxdmcp libbrotlidec libbrotlicommon \
                libgraphite2"

          for prefix in /opt/homebrew/lib /usr/local/lib; do
            if [ -d "$prefix" ]; then
              for lib in $LIBS; do
                for f in "$prefix/${lib}"*.dylib; do
                  [ -f "$f" ] && cp -L "$f" "$FRAMEWORKS/" 2>/dev/null || true
                done
              done
            fi
          done

          echo "=== Kopierte Libs: ==="
          ls -1 "$FRAMEWORKS" | head -40

          # Jetzt transitive Abhaengigkeiten ergaenzen und IDs umbiegen.
          # ACHTUNG: KEIN -od! Das wuerde Frameworks/ zuerst leeren und unsere
          # vorher kopierten dlopen-only-Libs (gobject etc.) wieder entfernen.
          BIN="$APP/Contents/MacOS/SmartRechnung"
          dylibbundler -b -x "$BIN" -d "$FRAMEWORKS/" -p "@executable_path/../Frameworks/" || true
          for f in "$FRAMEWORKS"/*.dylib; do
            dylibbundler -of -b -x "$f" -d "$FRAMEWORKS/" -p "@executable_path/../Frameworks/" 2>/dev/null || true
          done
          # Sicherstellen, dass die install_name und Pfade aller gebundelten Libs
          # auf @executable_path/../Frameworks/ zeigen (sonst scheitert ctypes)
          for f in "$FRAMEWORKS"/*.dylib; do
            install_name_tool -id "@executable_path/../Frameworks/$(basename $f)" "$f" 2>/dev/null || true
          done

          # Ad-hoc signieren, sonst blockt macOS die umgeschriebenen Libs
          codesign --force --deep --sign - "$APP" || true

          echo "=== Final im Frameworks: ==="
          ls -1 "$FRAMEWORKS" | wc -l
          echo "Dateien im Frameworks-Verzeichnis"

          # Die nackte Unix-Binary neben der .app nicht ausliefern - sie verwirrt
          # nur, weil sie ohne .app-Wrapper die System-Libs nicht findet.
          if [ -f "dist/SmartRechnung" ]; then
            rm -f "dist/SmartRechnung"
            echo "Nackte Binary 'dist/SmartRechnung' entfernt - nur .app wird ausgeliefert"
          fi
          ls -la dist/

      - name: Package
        shell: bash
        run: ${{ matrix.archive }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
